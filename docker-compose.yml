services:
  my-funds:
    build: .
    ports:
      - "5288:5288"
    environment:
      HOST: 0.0.0.0
      PORT: "5288"
      MY_FUNDS_DATA: /data
      CONFIG_PATH: /config/config.json
    volumes:
      - ./data:/data
      - ./config.json:/config/config.json:ro
    restart: unless-stopped
  backtest-worker:
    build:
      context: .
      dockerfile: backtest/Dockerfile
    volumes:
      - ./data/backtests:/data
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
